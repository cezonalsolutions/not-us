<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>

<title>NOT US WORKSPACE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  background:#ffffff;
  font-family:"Inter",sans-serif;
  color:#171717;
}


/* =========================
   MAIN PAGE
========================= */

.page{
  width:100%;
  min-height:100svh;

  display:flex;
  flex-direction:column;

  background:#fff;
}


/* =========================
   TOP HERO
========================= */

.hero{
  position:relative;

  width:100%;

  height:42svh;
  min-height:310px;
  max-height:410px;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #f7fbfa 0%,
      #f2f8f6 100%
    );

  border-bottom-left-radius:34px;
  border-bottom-right-radius:34px;
}


/* subtle texture */

.hero::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(15,118,110,.04),
      transparent 55%
    );

  pointer-events:none;
}


/* =========================
   MULTIPLE FAFA ICONS
========================= */

.icon{
  position:absolute;

  color:#0f766e;

  opacity:.075;

  pointer-events:none;
  user-select:none;

  z-index:1;
}


/* ROW 1 */

.i1{
  top:24px;
  left:20px;
  font-size:26px;
  transform:rotate(-12deg);
}

.i2{
  top:28px;
  left:88px;
  font-size:18px;
}

.i3{
  top:22px;
  right:92px;
  font-size:22px;
}

.i4{
  top:27px;
  right:20px;
  font-size:28px;
  transform:rotate(10deg);
}


/* ROW 2 */

.i5{
  top:78px;
  left:42px;
  font-size:21px;
}

.i6{
  top:86px;
  left:122px;
  font-size:17px;
  transform:rotate(-8deg);
}

.i7{
  top:76px;
  right:122px;
  font-size:18px;
}

.i8{
  top:86px;
  right:40px;
  font-size:23px;
  transform:rotate(10deg);
}


/* ROW 3 */

.i9{
  top:137px;
  left:15px;
  font-size:24px;
}

.i10{
  top:147px;
  left:80px;
  font-size:17px;
}

.i11{
  top:138px;
  right:81px;
  font-size:18px;
}

.i12{
  top:143px;
  right:15px;
  font-size:24px;
}


/* ROW 4 */

.i13{
  top:207px;
  left:32px;
  font-size:19px;
  transform:rotate(-10deg);
}

.i14{
  top:220px;
  left:105px;
  font-size:18px;
}

.i15{
  top:207px;
  right:105px;
  font-size:18px;
}

.i16{
  top:218px;
  right:28px;
  font-size:21px;
  transform:rotate(8deg);
}


/* BOTTOM ROW */

.i17{
  bottom:28px;
  left:18px;
  font-size:25px;
}

.i18{
  bottom:38px;
  left:78px;
  font-size:17px;
}

.i19{
  bottom:25px;
  left:145px;
  font-size:20px;
}

.i20{
  bottom:31px;
  right:145px;
  font-size:20px;
}

.i21{
  bottom:40px;
  right:78px;
  font-size:18px;
}

.i22{
  bottom:26px;
  right:18px;
  font-size:25px;
}


/* EXTRA FAINT ICONS */

.i23{
  top:48%;
  left:8px;

  font-size:15px;
}

.i24{
  top:48%;
  right:8px;

  font-size:15px;
}

.i25{
  bottom:85px;
  left:48px;

  font-size:15px;
}

.i26{
  bottom:87px;
  right:48px;

  font-size:15px;
}

.i27{
  top:112px;
  left:50%;

  transform:translateX(-50%);

  font-size:16px;
}

.i28{
  bottom:58px;
  left:50%;

  transform:translateX(-50%);

  font-size:17px;
}


/* =========================
   BRAND
========================= */

.brand-wrap{
  position:relative;

  z-index:5;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:22px 28px;
}


/* optional soft background behind brand */

.brand-wrap::before{
  content:"";

  position:absolute;

  width:180px;
  height:110px;

  border-radius:50%;

  background:rgba(255,255,255,.58);

  filter:blur(12px);

  z-index:-1;
}


.brand{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:9px;
}


.not-text{
  font-family:"Manrope",sans-serif;

  font-size:43px;

  line-height:1;

  font-weight:800;

  letter-spacing:-3.5px;

  color:#171717;
}


.us-text{
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 11px;

  border:1.5px solid #0f766e;
  border-radius:9px;

  background:rgba(255,255,255,.78);

  font-family:"Manrope",sans-serif;

  font-size:22px;
  font-weight:800;

  letter-spacing:-1px;

  color:#0f766e;

  backdrop-filter:blur(8px);
}


.workspace{
  margin-top:10px;

  padding-left:5px;

  font-size:8px;
  font-weight:700;

  letter-spacing:5px;

  color:#84938f;
}


/* =========================
   LOGIN SECTION
========================= */

.login-section{
  width:100%;

  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    30px
    24px
    calc(20px + env(safe-area-inset-bottom));
}


/* LOGIN TITLE CENTER */

.login-title{
  width:100%;
  max-width:350px;

  margin-bottom:22px;

  text-align:center;

  font-family:"Manrope",sans-serif;

  font-size:18px;
  font-weight:700;

  letter-spacing:-.4px;

  color:#1b1b1b;
}


/* FORM */

.login-form{
  width:100%;
  max-width:350px;
}


/* =========================
   INPUT
========================= */

.field{
  width:100%;
  margin-bottom:13px;
}

.input-box{
  position:relative;
}


.input-box input{
  width:100%;
  height:52px;

  border:1px solid #e4e4e4;
  border-radius:12px;

  outline:none;

  background:#fafafa;

  padding:0 15px;

  font-family:"Inter",sans-serif;

  font-size:13px;
  font-weight:500;

  color:#171717;

  transition:.2s ease;
}


.input-box input::placeholder{
  color:#aaa;

  font-weight:400;
}


.input-box input:focus{
  background:#fff;

  border-color:#0f766e;

  box-shadow:
    0 0 0 3px rgba(15,118,110,.06);
}


/* PASSWORD */

.password-input{
  padding-right:58px !important;
}


.show-btn{
  position:absolute;

  top:50%;
  right:8px;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  padding:9px 7px;

  color:#0f766e;

  font-family:"Inter",sans-serif;

  font-size:11px;
  font-weight:600;

  cursor:pointer;
}


/* =========================
   ERROR
========================= */

.field.error input{
  border-color:#ef4444;

  background:#fffafa;

  box-shadow:
    0 0 0 3px rgba(239,68,68,.05);
}


.field-error{
  display:none;

  margin-top:6px;
  margin-left:3px;

  color:#dc2626;

  font-size:10px;
  font-weight:500;
}


.field.error .field-error{
  display:block;
}


/* =========================
   FORGOT PASSWORD
========================= */

.forgot-row{
  width:100%;

  display:flex;
  justify-content:flex-end;

  margin-top:2px;
  margin-bottom:21px;
}


.forgot-btn{
  border:0;

  background:transparent;

  color:#0f766e;

  font-family:"Inter",sans-serif;

  font-size:11px;
  font-weight:600;

  cursor:pointer;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{
  width:100%;
  height:52px;

  border:0;
  border-radius:12px;

  background:#171717;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:"Inter",sans-serif;

  font-size:13px;
  font-weight:600;

  cursor:pointer;

  transition:.15s ease;
}


.login-btn:active{
  transform:scale(.985);
}


.login-btn:disabled{
  opacity:.65;
}


/* LOADER */

.loader{
  display:none;

  width:17px;
  height:17px;

  border:2px solid rgba(255,255,255,.3);

  border-top-color:#fff;

  border-radius:50%;

  animation:spin .7s linear infinite;
}


@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   DIVIDER
========================= */

.divider{
  width:100%;

  display:flex;
  align-items:center;

  gap:13px;

  margin:23px 0 17px;

  color:#b4b4b4;

  font-size:9px;
  font-weight:600;

  letter-spacing:1px;
}


.divider::before,
.divider::after{
  content:"";

  flex:1;

  height:1px;

  background:#ececec;
}


/* =========================
   OTP
========================= */

.otp-btn{
  width:100%;
  height:50px;

  border:1px solid #dedede;
  border-radius:12px;

  background:#fff;

  color:#171717;

  font-family:"Inter",sans-serif;

  font-size:12px;
  font-weight:600;

  cursor:pointer;

  transition:.15s ease;
}


.otp-btn:active{
  transform:scale(.985);

  background:#fafafa;
}


/* =========================
   TERMS
========================= */

.terms{
  width:100%;
  max-width:340px;

  margin-top:25px;

  text-align:center;

  color:#a5a5a5;

  font-size:9.5px;
  line-height:1.7;
}


.terms a{
  color:#555;

  font-weight:600;

  text-decoration:none;
}


/* =========================
   POWERED BY
========================= */

.powered{
  margin-top:auto;

  padding-top:26px;

  text-align:center;

  color:#b4b4b4;

  font-size:9px;
}


.powered strong{
  color:#707070;

  font-weight:600;
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .hero{
    min-height:285px;
  }

  .not-text{
    font-size:39px;
  }

  .us-text{
    height:37px;

    font-size:20px;
  }

  .login-section{
    padding-left:20px;
    padding-right:20px;
  }

}


/* SHORT SCREEN */

@media(max-height:720px){

  .hero{
    height:36svh;
    min-height:245px;
  }

  .login-section{
    padding-top:24px;
  }

  .login-title{
    margin-bottom:17px;
  }

  .terms{
    margin-top:18px;
  }

}


/* =========================
   MAIN WORKSPACE — STEP 1
   SAFE AREA + TOPBAR = ONE PIECE
========================= */
.workspace-screen{
  display:none;
  width:100%;
  min-height:100svh;
  background:#f5f7f8;
}
.workspace-screen.show{display:block}

.workspace-topbar{
  position:sticky;
  top:0;
  z-index:100;
  width:100%;
  min-height:103px;
  padding:35px 16px 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  background:#ffffff;
  border:0;
  border-bottom-left-radius:24px;
  border-bottom-right-radius:24px;
  box-shadow:0 5px 18px rgba(18,38,32,.05);
}

.workspace-company{
  min-width:0;
  height:68px;
  display:flex;
  align-items:center;
  gap:11px;
}
.workspace-company-logo{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  overflow:hidden;
  background:#eef5f3;
  display:grid;
  place-items:center;
  border:1px solid #e1e9e6;
}
.workspace-company-logo img{
  width:100%;height:100%;object-fit:cover;display:none;
}
.workspace-company-logo span{
  width:100%;height:100%;display:grid;place-items:center;
  font-family:"DM Sans",sans-serif;
  font-size:16px;font-weight:700;color:#0f766e;
}
.workspace-company-info{min-width:0}
.workspace-company-name{
  max-width:235px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:"Outfit",sans-serif;
  font-size:18px;
  line-height:1.15;
  font-weight:600;
  letter-spacing:-.25px;
  color:#171717;
}
.workspace-top-actions{
  height:68px;
  display:flex;
  align-items:center;
  gap:3px;
}
.workspace-icon-btn{
  width:38px;height:38px;border:0;border-radius:11px;
  background:transparent;color:#444b51;
  display:grid;place-items:center;font-size:16px;cursor:pointer;
}
.workspace-icon-btn:active{background:#f1f4f3}
.workspace-profile-btn{
  width:38px;height:38px;border:0;border-radius:50%;
  background:#f1f5f4;color:#26302d;
  display:grid;place-items:center;font-size:16px;cursor:pointer;
  transition:background .18s ease,transform .18s ease;
}
.workspace-profile-btn:active{background:#e8eeec;transform:scale(.96)}
.workspace-main{
  min-height:calc(100svh - 103px);
  margin-top:0;
  background:#f5f7f8;
  overflow:hidden;
}
.workspace-placeholder{
  padding:24px 18px;color:#9aa1a7;font-size:11px;text-align:center;
}

@media(max-width:380px){
  .workspace-topbar{padding-left:13px;padding-right:13px}
  .workspace-company-name{max-width:185px;font-size:16px}
}
/* STATUS CONTROL — TEXT ONLY, BEFORE SEARCH */
.workspace-status-wrap{position:relative}
.workspace-status-btn{
  height:38px;
  padding:0 8px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#2f9e62;
  font-family:"Inter",sans-serif;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  transition:color .24s ease,opacity .24s ease,transform .18s ease;
}
.workspace-status-btn:active{transform:scale(.97);opacity:.78}
.workspace-status-btn i{
  font-size:8px;
  color:currentColor;
  opacity:.65;
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.workspace-status-wrap.open .workspace-status-btn i{transform:rotate(180deg)}
.workspace-status-menu{
  position:absolute;
  right:0;
  top:44px;
  width:152px;
  padding:6px;
  background:#fff;
  border:1px solid #e7ebe9;
  border-radius:13px;
  box-shadow:0 16px 42px rgba(18,38,32,.12);
  z-index:150;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(-8px) scale(.98);
  transform-origin:top right;
  transition:opacity .24s ease,transform .28s cubic-bezier(.2,.8,.2,1),visibility .24s ease;
}
.workspace-status-menu.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}
.workspace-status-option{
  width:100%;
  height:38px;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:0 10px;
  display:flex;
  align-items:center;
  text-align:left;
  color:#343b38;
  font-family:"Inter",sans-serif;
  font-size:10px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.workspace-status-option:hover,.workspace-status-option.active{background:#f4f7f6}
.workspace-status-option:active{transform:scale(.985)}
@media(max-width:420px){
  .workspace-status-btn{padding:0 4px;font-size:10px}
  .workspace-top-actions{gap:2px}
}

/* SEARCH BAR BELOW TOP NAV */
.workspace-search-row{
  width:100%;
  padding:10px 16px 8px;
  background:#f5f7f8;
}

.workspace-search-box{
  width:100%;
  height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:#ffffff;
  border:1px solid #e6ebe9;
  border-radius:13px;
}

.workspace-search-box i{
  color:#8a9390;
  font-size:14px;
  flex:0 0 auto;
}

.workspace-search-box input{
  width:100%;
  height:100%;
  border:0;
  outline:none;
  background:transparent;
  font-family:"Inter",sans-serif;
  font-size:12px;
  font-weight:500;
  color:#171717;
}

.workspace-search-box input::placeholder{
  color:#9ba3a0;
  font-weight:400;
}

@media(max-width:380px){
  .workspace-search-row{
    padding-left:13px;
    padding-right:13px;
  }
}

</style>
</head>

<body>

<div class="page">


  <!-- TOP -->

  <section class="hero">


    <!-- MULTIPLE FAFA ICONS -->

    <i class="fa-solid fa-comments icon i1"></i>
    <i class="fa-solid fa-user-group icon i2"></i>
    <i class="fa-solid fa-calendar-days icon i3"></i>
    <i class="fa-solid fa-envelope icon i4"></i>

    <i class="fa-solid fa-briefcase icon i5"></i>
    <i class="fa-solid fa-chart-line icon i6"></i>
    <i class="fa-solid fa-folder-open icon i7"></i>
    <i class="fa-solid fa-bell icon i8"></i>

    <i class="fa-solid fa-video icon i9"></i>
    <i class="fa-solid fa-microphone icon i10"></i>
    <i class="fa-solid fa-cloud icon i11"></i>
    <i class="fa-solid fa-location-dot icon i12"></i>

    <i class="fa-solid fa-check-double icon i13"></i>
    <i class="fa-solid fa-clock icon i14"></i>
    <i class="fa-solid fa-paperclip icon i15"></i>
    <i class="fa-solid fa-message icon i16"></i>

    <i class="fa-solid fa-shield-halved icon i17"></i>
    <i class="fa-solid fa-file-lines icon i18"></i>
    <i class="fa-solid fa-list-check icon i19"></i>
    <i class="fa-solid fa-headset icon i20"></i>
    <i class="fa-solid fa-lock icon i21"></i>
    <i class="fa-solid fa-users icon i22"></i>

    <i class="fa-solid fa-phone icon i23"></i>
    <i class="fa-solid fa-camera icon i24"></i>
    <i class="fa-solid fa-database icon i25"></i>
    <i class="fa-solid fa-laptop icon i26"></i>
    <i class="fa-solid fa-share-nodes icon i27"></i>
    <i class="fa-solid fa-circle-check icon i28"></i>



    <!-- BRAND -->

    <div class="brand-wrap">

      <div class="brand">

        <span class="not-text">
          NOT
        </span>

        <span class="us-text">
          US
        </span>

      </div>

      <span class="workspace">
        WORKSPACE
      </span>

    </div>

  </section>



  <!-- LOGIN -->

  <section class="login-section">


    <div class="login-title">
      Login
    </div>


    <form
      class="login-form"
      id="loginForm"
      novalidate>


      <!-- EMAIL -->

      <div
        class="field"
        id="emailField">

        <div class="input-box">

          <input
            type="email"
            id="email"
            placeholder="Gmail"
            autocomplete="email"
          >

        </div>

        <div
          class="field-error"
          id="emailError">
          Please enter your Gmail
        </div>

      </div>



      <!-- PASSWORD -->

      <div
        class="field"
        id="passwordField">

        <div class="input-box">

          <input
            type="password"
            id="password"
            class="password-input"
            placeholder="Password"
            autocomplete="current-password"
          >

          <button
            type="button"
            class="show-btn"
            id="showBtn">
            Show
          </button>

        </div>

        <div
          class="field-error"
          id="passwordError">
          Please enter your password
        </div>

      </div>



      <!-- FORGOT -->

      <div class="forgot-row">

        <button
          type="button"
          class="forgot-btn"
          id="forgotBtn">
          Forgot password?
        </button>

      </div>



      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-btn"
        id="loginBtn">

        <span id="loginText">
          Log in
        </span>

        <span
          class="loader"
          id="loader">
        </span>

      </button>



      <!-- OR -->

      <div class="divider">
        OR
      </div>



      <!-- OTP -->

      <button
        type="button"
        class="otp-btn"
        id="otpBtn">
        Login with OTP
      </button>

    </form>



    <!-- TERMS -->

    <div class="terms">

      By continuing, I accept the

      <a href="#">
        Terms & Conditions
      </a>

      and

      <a href="#">
        Privacy Policy
      </a>.

    </div>



    <!-- POWERED -->

    <div class="powered">

<!-- =========================
     MAIN WORKSPACE — STEP 1
========================== -->
<div class="workspace-screen" id="workspaceScreen">
  <header class="workspace-topbar">
    <div class="workspace-company">
      <div class="workspace-company-logo">
        <img id="workspaceCompanyLogo" alt="Company logo">
        <span id="workspaceCompanyFallback">C</span>
      </div>
      <div class="workspace-company-info">
        <div class="workspace-company-name" id="workspaceCompanyName">Company</div>
      </div>
    </div>

    <div class="workspace-top-actions">
      <div class="workspace-status-wrap" id="workspaceStatusWrap">
        <button class="workspace-status-btn" id="workspaceStatusBtn" type="button" aria-label="Work status">
          <span class="workspace-status-text" id="workspaceStatusText">Available</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="workspace-status-menu" id="workspaceStatusMenu">
          <button class="workspace-status-option active" type="button" data-status="available" data-label="Available">Available</button>
          <button class="workspace-status-option" type="button" data-status="break" data-label="On Break">On Break</button>
          <button class="workspace-status-option" type="button" data-status="meeting" data-label="In Meeting">In Meeting</button>
          <button class="workspace-status-option" type="button" data-status="busy" data-label="Busy">Busy</button>
          <button class="workspace-status-option" type="button" data-status="offline" data-label="Offline">Offline</button>
        </div>
      </div>
<button class="workspace-profile-btn" type="button" aria-label="Profile">
        <i class="fa-solid fa-circle-user"></i>
      </button>
    </div>
  </header>

  <div class="workspace-search-row">
    <div class="workspace-search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="search"
        id="workspaceSearch"
        placeholder="Search"
        autocomplete="off"
        aria-label="Search"
      >
    </div>
  </div>

  <main class="workspace-main" id="workspaceMain">
    <!-- Next: WhatsApp-like main content goes here -->
  </main>
</div>


<script>
/* ================================
   NOT US WORKSPACE — REAL LOGIN
   Uses the same Supabase project + RPC login flow
   as the existing NOT US Admin Workspace.
================================ */

const SUPABASE_URL = "https://ombeqzdgfyokujhscoaf.supabase.co";
const SUPABASE_KEY = "sb_publishable_6Jmaoj_y512Z91tAWTT6VA_r4VQEBwy";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const emailField = document.getElementById("emailField");
const passwordField = document.getElementById("passwordField");
const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");
const showBtn = document.getElementById("showBtn");
const forgotBtn = document.getElementById("forgotBtn");
const otpBtn = document.getElementById("otpBtn");
const loginBtn = document.getElementById("loginBtn");
const loginText = document.getElementById("loginText");
const loader = document.getElementById("loader");

/* Small status message below form */
const loginStatus = document.createElement("div");
loginStatus.id = "loginStatus";
loginStatus.style.cssText = `
  display:none;
  margin-top:12px;
  text-align:center;
  font-family:Inter,sans-serif;
  font-size:10px;
  font-weight:600;
  line-height:1.5;
`;
form.appendChild(loginStatus);

showBtn.addEventListener("click", function(){
  const hidden = password.type === "password";
  password.type = hidden ? "text" : "password";
  showBtn.textContent = hidden ? "Hide" : "Show";
});

email.addEventListener("input", function(){
  emailField.classList.remove("error");
  hideStatus();
});

password.addEventListener("input", function(){
  passwordField.classList.remove("error");
  hideStatus();
});

form.addEventListener("submit", async function(e){
  e.preventDefault();

  emailField.classList.remove("error");
  passwordField.classList.remove("error");
  hideStatus();

  const gmail = email.value.trim().toLowerCase();
  const pass = password.value;
  let valid = true;

  if(!gmail){
    setError(emailField, emailError, "Please enter your Gmail");
    valid = false;
  }else if(!validEmail(gmail)){
    setError(emailField, emailError, "Please enter a valid Gmail address");
    valid = false;
  }

  if(!pass){
    setError(passwordField, passwordError, "Please enter your password");
    valid = false;
  }

  if(!valid) return;

  startLoading();

  try{
    let session = null;

    /* 1. COMPANY ADMIN */
    const { data: companyData, error: companyError } = await db.rpc("company_login", {
      p_gmail: gmail,
      p_password: pass
    });
    if(companyError) throw companyError;

    const company = Array.isArray(companyData) ? companyData[0] : companyData;

    if(company && company.success === true){
      session = {
        user_type: "company_admin",
        company_id: company.company_id,
        company_name: company.company_name,
        gmail: company.gmail,
        status: company.status,
        logged_in_at: new Date().toISOString()
      };
    }

    /* 2. HR */
    if(!session){
      const { data: hrData, error: hrError } = await db.rpc("hr_login", {
        p_gmail: gmail,
        p_password: pass
      });
      if(hrError) throw hrError;

      const hr = Array.isArray(hrData) ? hrData[0] : hrData;

      if(hr && hr.success === true){
        session = {
          user_type: "hr",
          hr_id: hr.hr_id,
          company_id: hr.company_id,
          company_name: hr.company_name,
          branch_id: hr.branch_id,
          branch_name: hr.branch_name,
          branch_location: hr.branch_location,
          full_name: hr.full_name,
          gmail: hr.gmail,
          role: hr.role,
          status: hr.status,
          logged_in_at: new Date().toISOString()
        };
      }
    }

    /* 3. EMPLOYEE / TEAM LEAD / MANAGER / RECRUITER / IT / SUPPORT */
    if(!session){
      const { data: employeeData, error: employeeError } = await db.rpc("employee_login", {
        p_gmail: gmail,
        p_password: pass
      });
      if(employeeError) throw employeeError;

      const employee = Array.isArray(employeeData) ? employeeData[0] : employeeData;

      if(employee && employee.success === true){
        let resolvedEmployeeRole = String(
          employee.role || employee.employee_role || "Employee"
        ).trim();

        try{
          const loginEmail = String(employee.gmail || gmail).trim().toLowerCase();
          const rr = await db
            .from("employees")
            .select("id,role")
            .eq("company_id", employee.company_id)
            .ilike("email", loginEmail)
            .maybeSingle();

          if(!rr.error && rr.data?.role){
            resolvedEmployeeRole = String(rr.data.role).trim();
            if(rr.data.id) employee.employee_id = rr.data.id;
          }
        }catch(roleErr){
          console.warn("Could not refresh exact employee role:", roleErr);
        }

        const roleKey = resolvedEmployeeRole
          .toLowerCase()
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();

        let employeeUserType = "employee";

        if(roleKey === "team lead") employeeUserType = "team_lead";
        else if(roleKey === "manager") employeeUserType = "manager";
        else if(roleKey === "recruiter" || roleKey.includes("recruit")) employeeUserType = "recruiter";
        else if(roleKey === "it administrator") employeeUserType = "it_admin";
        else if(roleKey === "technical supporter") employeeUserType = "technical_supporter";

        session = {
          user_type: employeeUserType,
          employee_id: employee.employee_id,
          team_lead_id: employee.employee_id,
          company_id: employee.company_id,
          company_name: employee.company_name,
          branch_id: employee.branch_id,
          branch_name: employee.branch_name,
          branch_location: employee.branch_location,
          full_name: employee.full_name,
          gmail: employee.gmail,
          role: resolvedEmployeeRole || employee.role,
          status: employee.status,
          logged_in_at: new Date().toISOString()
        };
      }
    }

    if(!session){
      setError(emailField, emailError, "Gmail or password is incorrect");
      setError(passwordField, passwordError, "Check your login details");
      return;
    }

    localStorage.setItem("notus_company_session", JSON.stringify(session));
    window.notusSession = session;

    showStatus("Login successful", "success");

    setTimeout(function(){
      showWorkspace(session);
    }, 350);

  }catch(err){
    console.error("Login error:", err);
    showStatus(err?.message || "Unable to login. Please try again.", "error");
  }finally{
    stopLoading();
  }
});

/* Only normal Login is connected right now */
otpBtn.addEventListener("click", function(){
  const gmail = email.value.trim();
  if(!gmail){
    setError(emailField, emailError, "Please enter your Gmail");
    email.focus();
    return;
  }
  showStatus("OTP login will be connected next.", "info");
});

forgotBtn.addEventListener("click", function(){
  const gmail = email.value.trim();
  if(!gmail){
    setError(emailField, emailError, "Please enter your Gmail");
    email.focus();
    return;
  }
  showStatus("Forgot password will be connected next.", "info");
});

function setError(field, errorElement, text){
  field.classList.add("error");
  errorElement.textContent = text;
}

function validEmail(value){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function startLoading(){
  loginBtn.disabled = true;
  loginText.style.display = "none";
  loader.style.display = "block";
}

function stopLoading(){
  loginBtn.disabled = false;
  loginText.style.display = "inline";
  loader.style.display = "none";
}

function showStatus(text, type){
  loginStatus.style.display = "block";
  loginStatus.textContent = text;

  if(type === "success") loginStatus.style.color = "#0f766e";
  else if(type === "error") loginStatus.style.color = "#dc2626";
  else loginStatus.style.color = "#6b7280";
}



/* ================================
   TOP WORK STATUS UI
================================ */
const workspaceStatusBtn = document.getElementById("workspaceStatusBtn");
const workspaceStatusMenu = document.getElementById("workspaceStatusMenu");
const workspaceStatusText = document.getElementById("workspaceStatusText");
const workspaceStatusWrap = document.getElementById("workspaceStatusWrap");

const statusColors = {
  available:"#2f9e62",
  break:"#d58a28",
  meeting:"#5a6fd1",
  busy:"#cf5757",
  offline:"#8a9390"
};

function paintWorkspaceStatus(status,label){
  if(workspaceStatusText) workspaceStatusText.textContent = label || "Available";
  if(workspaceStatusBtn) workspaceStatusBtn.style.color = statusColors[status] || statusColors.available;
  document.querySelectorAll(".workspace-status-option").forEach(btn=>{
    const active = btn.dataset.status === status;
    btn.classList.toggle("active", active);
    btn.style.color = active ? (statusColors[status] || statusColors.available) : "#343b38";
  });
}

workspaceStatusBtn?.addEventListener("click", function(e){
  e.stopPropagation();
  const opening = !workspaceStatusMenu?.classList.contains("show");
  workspaceStatusMenu?.classList.toggle("show", opening);
  workspaceStatusWrap?.classList.toggle("open", opening);
});

document.querySelectorAll(".workspace-status-option").forEach(btn=>{
  btn.addEventListener("click", function(){
    const status = this.dataset.status || "available";
    const label = this.dataset.label || "Available";
    paintWorkspaceStatus(status,label);
    workspaceStatusMenu?.classList.remove("show");
    workspaceStatusWrap?.classList.remove("open");
    try{localStorage.setItem("notus_workspace_status",JSON.stringify({status,label}));}catch(e){}
  });
});

document.addEventListener("click", function(){
  workspaceStatusMenu?.classList.remove("show");
  workspaceStatusWrap?.classList.remove("open");
});

try{
  const savedStatus = JSON.parse(localStorage.getItem("notus_workspace_status") || "null");
  if(savedStatus?.status) paintWorkspaceStatus(savedStatus.status,savedStatus.label);
}catch(e){}

/* ================================
   OPEN MAIN WORKSPACE
================================ */
function formatCompanyName(value){
  const text = String(value || "Company").trim().toLowerCase();
  return text.replace(/(^|\s|[-&/()])([a-z])/g, (m, before, letter) => before + letter.toUpperCase());
}

async function showWorkspace(session){
  const loginPage = document.querySelector(".page");
  const workspace = document.getElementById("workspaceScreen");
  if(loginPage) loginPage.style.display = "none";
  if(workspace) workspace.classList.add("show");

  const companyName = formatCompanyName(session?.company_name || "Company");
  const nameEl = document.getElementById("workspaceCompanyName");
  const fallback = document.getElementById("workspaceCompanyFallback");
  if(nameEl) nameEl.textContent = companyName;
  if(fallback) fallback.textContent = (companyName[0] || "C").toUpperCase();

  await loadWorkspaceCompanyLogo(session?.company_id);
}

async function loadWorkspaceCompanyLogo(companyId){
  const img = document.getElementById("workspaceCompanyLogo");
  const fallback = document.getElementById("workspaceCompanyFallback");
  if(!img || !fallback || !companyId) return;

  img.style.display = "none";
  fallback.style.display = "grid";

  try{
    const {data,error} = await db.rpc("list_companies_with_logo");
    if(error) throw error;

    const company = (data || []).find(x => String(x.id) === String(companyId));
    const logo = company?.logo_url;
    if(!logo) return;

    img.onload = function(){
      img.style.display = "block";
      fallback.style.display = "none";
    };
    img.onerror = function(){
      img.style.display = "none";
      fallback.style.display = "grid";
    };
    img.src = logo;
  }catch(err){
    console.warn("Company logo load failed:", err);
  }
}

/* Restore already logged-in session on reload */
(function restoreLogin(){
  try{
    const saved = JSON.parse(localStorage.getItem("notus_company_session") || "null");
    if(saved?.company_id){
      window.notusSession = saved;
      showWorkspace(saved);
    }
  }catch(e){}
})();

function hideStatus(){
  loginStatus.style.display = "none";
  loginStatus.textContent = "";
}
</script>

</body>
