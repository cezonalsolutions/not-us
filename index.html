<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  background:#ffffff;
  font-family:"Inter",sans-serif;
  color:#171717;
}


/* =========================
   MAIN PAGE
========================= */

.page{
  width:100%;
  min-height:100svh;

  display:flex;
  flex-direction:column;

  background:#fff;
}


/* =========================
   TOP HERO
========================= */

.hero{
  position:relative;

  width:100%;

  height:42svh;
  min-height:310px;
  max-height:410px;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #f7fbfa 0%,
      #f2f8f6 100%
    );

  border-bottom-left-radius:34px;
  border-bottom-right-radius:34px;
}


/* subtle texture */

.hero::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(15,118,110,.04),
      transparent 55%
    );

  pointer-events:none;
}

   MULTIPLE FAFA ICONS
========================= */

.icon{

  color:#0f766e;

  opacity:.075;

  pointer-events:none;
  user-select:none;

  z-index:1;

/* =========================
   BRAND
========================= */

.brand-wrap{
  position:relative;

  z-index:5;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:22px 28px;
}


/* optional soft background behind brand */

.brand-wrap::before{
  content:"";

  position:absolute;

  width:180px;
  height:110px;

  border-radius:50%;

  background:rgba(255,255,255,.58);

  filter:blur(12px);

  z-index:-1;
}


.brand{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:9px;
}


.not-text{
  font-family:"Manrope",sans-serif;

  font-size:43px;

  line-height:1;

  font-weight:800;

  letter-spacing:-3.5px;

  color:#171717;
}


.us-text{
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 11px;

  border:1.5px solid #0f766e;
  border-radius:9px;

  background:rgba(255,255,255,.78);

  font-family:"Manrope",sans-serif;

  font-size:22px;
  font-weight:800;

  letter-spacing:-1px;

  color:#0f766e;

  backdrop-filter:blur(8px);
}


.workspace{
  margin-top:10px;

  padding-left:5px;

  font-size:8px;
  font-weight:700;

  letter-spacing:5px;

  color:#84938f;
}


/* =========================
   LOGIN SECTION
========================= */

.login-section{
  width:100%;

  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    30px
    24px
    calc(20px + env(safe-area-inset-bottom));
}


/* LOGIN TITLE CENTER */

.login-title{
  width:100%;
  max-width:350px;

  margin-bottom:22px;

  text-align:center;

  font-family:"Manrope",sans-serif;

  font-size:18px;
  font-weight:700;

  letter-spacing:-.4px;

  color:#1b1b1b;
}


/* FORM */

.login-form{
  width:100%;
  max-width:350px;
}


/* =========================
   INPUT
========================= */

.field{
  width:100%;
  margin-bottom:13px;
}

.input-box{
  position:relative;
}


.input-box input{
  width:100%;
  height:52px;

  border:1px solid #e4e4e4;
  border-radius:12px;

  outline:none;

  background:#fafafa;

  padding:0 15px;

  font-family:"Inter",sans-serif;

  font-size:13px;
  font-weight:500;

  color:#171717;

  transition:.2s ease;
}


.input-box input::placeholder{
  color:#aaa;

  font-weight:400;
}


.input-box input:focus{
  background:#fff;

  border-color:#0f766e;

  box-shadow:
    0 0 0 3px rgba(15,118,110,.06);
}


/* PASSWORD */

.password-input{
  padding-right:58px !important;
}


.show-btn{
  position:absolute;

  top:50%;
  right:8px;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  padding:9px 7px;

  color:#0f766e;

  font-family:"Inter",sans-serif;

  font-size:11px;
  font-weight:600;

  cursor:pointer;
}


/* =========================
   ERROR
========================= */

.field.error input{
  border-color:#ef4444;

  background:#fffafa;

  box-shadow:
    0 0 0 3px rgba(239,68,68,.05);
}


.field-error{
  display:none;

  margin-top:6px;
  margin-left:3px;

  color:#dc2626;

  font-size:10px;
  font-weight:500;
}


.field.error .field-error{
  display:block;
}


/* =========================
   FORGOT PASSWORD
========================= */

.forgot-row{
  width:100%;

  display:flex;
  justify-content:flex-end;

  margin-top:2px;
  margin-bottom:21px;
}


.forgot-btn{
  border:0;

  background:transparent;

  color:#0f766e;

  font-family:"Inter",sans-serif;

  font-size:11px;
  font-weight:600;

  cursor:pointer;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{
  width:100%;
  height:52px;

  border:0;
  border-radius:12px;

  background:#171717;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:"Inter",sans-serif;

  font-size:13px;
  font-weight:600;

  cursor:pointer;

  transition:.15s ease;
}


.login-btn:active{
  transform:scale(.985);
}


.login-btn:disabled{
  opacity:.65;
}


/* LOADER */

.loader{
  display:none;

  width:17px;
  height:17px;

  border:2px solid rgba(255,255,255,.3);

  border-top-color:#fff;

  border-radius:50%;

  animation:spin .7s linear infinite;
}


@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   DIVIDER
========================= */

.divider{
  width:100%;

  display:flex;
  align-items:center;

  gap:13px;

  margin:23px 0 17px;

  color:#b4b4b4;

  font-size:9px;
  font-weight:600;

  letter-spacing:1px;
}


.divider::before,
.divider::after{
  content:"";

  flex:1;

  height:1px;

  background:#ececec;
}


/* =========================
   OTP
========================= */

.otp-btn{
  width:100%;
  height:50px;

  border:1px solid #dedede;
  border-radius:12px;

  background:#fff;

  color:#171717;

  font-family:"Inter",sans-serif;

  font-size:12px;
  font-weight:600;

  cursor:pointer;

  transition:.15s ease;
}


.otp-btn:active{
  transform:scale(.985);

  background:#fafafa;
}


/* =========================
   TERMS
========================= */

.terms{
  width:100%;
  max-width:340px;

  margin-top:25px;

  text-align:center;

  color:#a5a5a5;

  font-size:9.5px;
  line-height:1.7;
}


.terms a{
  color:#555;

  font-weight:600;

  text-decoration:none;
}


/* =========================
   POWERED BY
========================= */

.powered{
  margin-top:auto;

  padding-top:26px;

  text-align:center;

  color:#b4b4b4;

  font-size:9px;
}


.powered strong{
  color:#707070;

  font-weight:600;
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .hero{
    min-height:285px;
  }

  .not-text{
    font-size:39px;
  }

  .us-text{
    height:37px;

    font-size:20px;
  }

  .login-section{
    padding-left:20px;
    padding-right:20px;
  }

}


/* SHORT SCREEN */

@media(max-height:720px){

  .hero{
    height:36svh;
    min-height:245px;
  }

  .login-section{
    padding-top:24px;
  }

  .login-title{
    margin-bottom:17px;
  }

  .terms{
    margin-top:18px;
  }

}


/* =========================
   MAIN WORKSPACE — STEP 1
   SAFE AREA + TOPBAR = ONE PIECE
========================= */
.workspace-screen{
  display:none;
  width:100%;
  min-height:100svh;
  background:#f5f7f8;
}
.workspace-screen.show{display:block}

.workspace-topbar{
  position:sticky;
  top:0;
  z-index:100;
  width:100%;
  min-height:103px;
  padding:35px 16px 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  background:#ffffff;
  border:0;
  border-bottom-left-radius:24px;
  border-bottom-right-radius:24px;
  box-shadow:0 5px 18px rgba(18,38,32,.05);
}

.workspace-company{
  min-width:0;
  height:68px;
  display:flex;
  align-items:center;
  gap:11px;
}
.workspace-company-logo{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  overflow:hidden;
  background:#eef5f3;
  display:grid;
  place-items:center;
  border:1px solid #e1e9e6;
}
.workspace-company-logo img{
  width:100%;height:100%;object-fit:cover;display:none;
}
.workspace-company-logo span{
  width:100%;height:100%;display:grid;place-items:center;
  font-family:"DM Sans",sans-serif;
  font-size:16px;font-weight:700;color:#0f766e;
}
.workspace-company-info{min-width:0}
.workspace-company-name{
  max-width:235px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:"Outfit",sans-serif;
  font-size:18px;
  line-height:1.15;
  font-weight:600;
  letter-spacing:-.25px;
  color:#171717;
}
.workspace-top-actions{
  height:68px;
  display:flex;
  align-items:center;
  gap:3px;
}
.workspace-icon-btn{
  width:38px;height:38px;border:0;border-radius:11px;
  background:transparent;color:#444b51;
  display:grid;place-items:center;font-size:16px;cursor:pointer;
}
.workspace-icon-btn:active{background:#f1f4f3}
.workspace-profile-btn{
  width:38px;height:38px;border:0;border-radius:50%;
  background:#f1f5f4;color:#26302d;
  display:grid;place-items:center;font-size:16px;cursor:pointer;
  transition:background .18s ease,transform .18s ease;
}
.workspace-profile-btn:active{background:#e8eeec;transform:scale(.96)}
.workspace-main{
  min-height:calc(100svh - 103px);
  margin-top:0;
  background:#f5f7f8;
  overflow:hidden;
}
.workspace-placeholder{
  padding:24px 18px;color:#9aa1a7;font-size:11px;text-align:center;
}

@media(max-width:380px){
  .workspace-topbar{padding-left:13px;padding-right:13px}
  .workspace-company-name{max-width:185px;font-size:16px}
}
/* STATUS CONTROL — TEXT ONLY, BEFORE SEARCH */
.workspace-status-wrap{position:relative}
.workspace-status-btn{
  height:38px;
  padding:0 8px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#2f9e62;
  font-family:"Inter",sans-serif;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  transition:color .24s ease,opacity .24s ease,transform .18s ease;
}
.workspace-status-btn:active{transform:scale(.97);opacity:.78}
.workspace-status-btn i{
  font-size:8px;
  color:currentColor;
  opacity:.65;
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.workspace-status-wrap.open .workspace-status-btn i{transform:rotate(180deg)}
.workspace-status-menu{
  position:absolute;
  right:0;
  top:44px;
  width:152px;
  padding:6px;
  background:#fff;
  border:1px solid #e7ebe9;
  border-radius:13px;
  box-shadow:0 16px 42px rgba(18,38,32,.12);
  z-index:150;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(-8px) scale(.98);
  transform-origin:top right;
  transition:opacity .24s ease,transform .28s cubic-bezier(.2,.8,.2,1),visibility .24s ease;
}
.workspace-status-menu.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}
.workspace-status-option{
  width:100%;
  height:38px;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:0 10px;
  display:flex;
  align-items:center;
  text-align:left;
  color:#343b38;
  font-family:"Inter",sans-serif;
  font-size:10px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.workspace-status-option:hover,.workspace-status-option.active{background:#f4f7f6}
.workspace-status-option:active{transform:scale(.985)}
@media(max-width:420px){
  .workspace-status-btn{padding:0 4px;font-size:10px}
  .workspace-top-actions{gap:2px}
}

/* SEARCH BAR BELOW TOP NAV */
.workspace-search-row{
  width:100%;
  padding:10px 16px 8px;
  background:#f5f7f8;
}

.workspace-search-box{
  width:100%;
  height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:#ffffff;
  border:1px solid #e6ebe9;
  border-radius:13px;
}

.workspace-search-box i{
  color:#8a9390;
  font-size:14px;
  flex:0 0 auto;
}

.workspace-search-box input{
  width:100%;
  height:100%;
  border:0;
  outline:none;
  background:transparent;
  font-family:"Inter",sans-serif;
  font-size:12px;
  font-weight:500;
  color:#171717;
}

.workspace-search-box input::placeholder{
  color:#9ba3a0;
  font-weight:400;
}

@media(max-width:380px){
  .workspace-search-row{
    padding-left:13px;
    padding-right:13px;
  }
}


/* PROFILE SIDE NAV */
.workspace-profile-overlay{position:fixed;inset:0;background:rgba(17,24,39,.22);backdrop-filter:blur(1.5px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility .25s ease;z-index:998}.workspace-profile-overlay.show{opacity:1;visibility:visible;pointer-events:auto}.workspace-profile-panel{position:fixed;top:0;right:0;z-index:999;width:min(86vw,340px);height:100svh;background:#fff;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-16px 0 44px rgba(18,38,32,.14);display:flex;flex-direction:column;padding-top:max(22px,env(safe-area-inset-top))}.workspace-profile-panel.show{transform:translateX(0)}.profile-panel-top{padding:14px 18px 18px;border-bottom:1px solid #edf0ef}.profile-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.profile-panel-title{font-family:"Outfit",sans-serif;font-size:17px;font-weight:600;color:#171717}.profile-panel-close{width:34px;height:34px;border:0;background:transparent;display:grid;place-items:center;color:#555f5b;font-size:17px;cursor:pointer}.profile-user-card{padding:20px 18px 18px;display:flex;align-items:center;gap:13px}.profile-user-avatar{width:54px;height:54px;border-radius:16px;background:#eef5f3;color:#0f766e;display:grid;place-items:center;font-family:"Outfit",sans-serif;font-size:20px;font-weight:700;flex:0 0 54px}.profile-user-info{min-width:0;flex:1}.profile-user-name{font-family:"Outfit",sans-serif;font-size:16px;font-weight:600;color:#171717;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-user-role{margin-top:3px;font-size:10px;font-weight:600;color:#0f766e}.profile-details{padding:0 18px}.profile-detail-item{min-height:48px;display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0f2f1}.profile-detail-icon{width:26px;color:#7d8783;font-size:13px;text-align:center;padding-top:2px;flex:0 0 26px}.profile-detail-content{min-width:0}.profile-detail-label{font-size:9px;font-weight:600;color:#9aa2a0;margin-bottom:3px}.profile-detail-value{font-size:11px;font-weight:600;color:#2a302e;word-break:break-word}.profile-panel-footer{margin-top:auto;padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #edf0ef}.profile-logout-btn{width:100%;height:46px;border:0;border-radius:12px;background:#fff5f5;color:#c93535;display:flex;align-items:center;justify-content:center;gap:9px;font-family:"Inter",sans-serif;font-size:12px;font-weight:700;cursor:pointer}.profile-logout-btn:active{transform:scale(.985)}


/* PROFILE ICON — PLAIN */
.workspace-profile-btn{
  width:auto !important;height:auto !important;padding:8px !important;
  border:0 !important;border-radius:0 !important;background:transparent !important;
  box-shadow:none !important;color:#444b51 !important;
  font-size:21px !important;
}
.workspace-profile-btn:active,.workspace-profile-btn:hover{background:transparent !important;}

/* =========================
   CHAT LIST + iPHONE STYLE PULL REFRESH
========================= */
.workspace-main{
  position:relative;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  background:#f3f6f5;
}
.pull-refresh{
  position:absolute;
  left:50%;
  top:3px;
  z-index:20;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 18px rgba(25,45,39,.12);
  opacity:0;
  pointer-events:none;
  transform:translate3d(-50%,-30px,0) scale(.82);
  transition:opacity .16s ease,transform .20s cubic-bezier(.2,.8,.2,1);
  will-change:transform,opacity;
}
.pull-refresh.show{opacity:1}
.pull-spinner{
  width:20px;
  height:20px;
  border-radius:50%;
  background:conic-gradient(

<script>
/* ================================
   NOT US WORKSPACE — REAL LOGIN
   Uses the same Supabase project + RPC login flow
   as the existing NOT US Admin Workspace.
================================ */

const SUPABASE_URL = "https://ombeqzdgfyokujhscoaf.supabase.co";
const SUPABASE_KEY = "sb_publishable_6Jmaoj_y512Z91tAWTT6VA_r4VQEBwy";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const emailField = document.getElementById("emailField");
const passwordField = document.getElementById("passwordField");
const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");
const showBtn = document.getElementById("showBtn");
const forgotBtn = document.getElementById("forgotBtn");
const otpBtn = document.getElementById("otpBtn");
const loginBtn = document.getElementById("loginBtn");
const loginText = document.getElementById("loginText");
const loader = document.getElementById("loader");

/* Small status message below form */
const loginStatus = document.createElement("div");
loginStatus.id = "loginStatus";
loginStatus.style.cssText = `
  display:none;
  margin-top:12px;
  text-align:center;
  font-family:Inter,sans-serif;
  font-size:10px;
  font-weight:600;
  line-height:1.5;
`;
form.appendChild(loginStatus);

showBtn.addEventListener("click", function(){
  const hidden = password.type === "password";
  password.type = hidden ? "text" : "password";
  showBtn.textContent = hidden ? "Hide" : "Show";
});

email.addEventListener("input", function(){
  emailField.classList.remove("error");
  hideStatus();
});

password.addEventListener("input", function(){
  passwordField.classList.remove("error");
  hideStatus();
});

form.addEventListener("submit", async function(e){
  e.preventDefault();

  emailField.classList.remove("error");
  passwordField.classList.remove("error");
  hideStatus();

  const gmail = email.value.trim().toLowerCase();
  const pass = password.value;
  let valid = true;

  if(!gmail){
    setError(emailField, emailError, "Please enter your Gmail");
    valid = false;
  }else if(!validEmail(gmail)){
    setError(emailField, emailError, "Please enter a valid Gmail address");
    valid = false;
  }

  if(!pass){
    setError(passwordField, passwordError, "Please enter your password");
    valid = false;
  }

  if(!valid) return;

  startLoading();

  try{
    let session = null;

    /* 1. COMPANY ADMIN */
    const { data: companyData, error: companyError } = await db.rpc("company_login", {
      p_gmail: gmail,
      p_password: pass
    });
    if(companyError) throw companyError;

    const company = Array.isArray(companyData) ? companyData[0] : companyData;

    if(company && company.success === true){
      session = {
        user_type: "company_admin",
        company_id: company.company_id,
        company_name: company.company_name,
        gmail: company.gmail,
        status: company.status,
        logged_in_at: new Date().toISOString()
      };
    }

    /* 2. HR */
    if(!session){
      const { data: hrData, error: hrError } = await db.rpc("hr_login", {
        p_gmail: gmail,
        p_password: pass
      });
      if(hrError) throw hrError;

      const hr = Array.isArray(hrData) ? hrData[0] : hrData;

      if(hr && hr.success === true){
        session = {
          user_type: "hr",
          hr_id: hr.hr_id,
          company_id: hr.company_id,
          company_name: hr.company_name,
          branch_id: hr.branch_id,
          branch_name: hr.branch_name,
          branch_location: hr.branch_location,
          full_name: hr.full_name,
          gmail: hr.gmail,
          role: hr.role,
          status: hr.status,
          logged_in_at: new Date().toISOString()
        };
      }
    }

    /* 3. EMPLOYEE / TEAM LEAD / MANAGER / RECRUITER / IT / SUPPORT */
    if(!session){
      const { data: employeeData, error: employeeError } = await db.rpc("employee_login", {
        p_gmail: gmail,
        p_password: pass
      });
      if(employeeError) throw employeeError;

      const employee = Array.isArray(employeeData) ? employeeData[0] : employeeData;

      if(employee && employee.success === true){
        let resolvedEmployeeRole = String(
          employee.role || employee.employee_role || "Employee"
        ).trim();

        try{
          const loginEmail = String(employee.gmail || gmail).trim().toLowerCase();
          const rr = await db
            .from("employees")
            .select("id,role")
            .eq("company_id", employee.company_id)
            .ilike("email", loginEmail)
            .maybeSingle();

          if(!rr.error && rr.data?.role){
            resolvedEmployeeRole = String(rr.data.role).trim();
            if(rr.data.id) employee.employee_id = rr.data.id;
          }
        }catch(roleErr){
          console.warn("Could not refresh exact employee role:", roleErr);
        }

        const roleKey = resolvedEmployeeRole
          .toLowerCase()
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();

        let employeeUserType = "employee";

        if(roleKey === "team lead") employeeUserType = "team_lead";
        else if(roleKey === "manager") employeeUserType = "manager";
        else if(roleKey === "recruiter" || roleKey.includes("recruit")) employeeUserType = "recruiter";
        else if(roleKey === "it administrator") employeeUserType = "it_admin";
        else if(roleKey === "technical supporter") employeeUserType = "technical_supporter";

        session = {
          user_type: employeeUserType,
          employee_id: employee.employee_id,
          team_lead_id: employee.employee_id,
          company_id: employee.company_id,
          company_name: employee.company_name,
          branch_id: employee.branch_id,
          branch_name: employee.branch_name,
          branch_location: employee.branch_location,
          full_name: employee.full_name,
          gmail: employee.gmail,
          role: resolvedEmployeeRole || employee.role,
          status: employee.status,
          logged_in_at: new Date().toISOString()
        };
      }
    }

    if(!session){
      setError(emailField, emailError, "Gmail or password is incorrect");
      setError(passwordField, passwordError, "Check your login details");
      return;
    }

    localStorage.setItem("notus_company_session", JSON.stringify(session));
    window.notusSession = session;

    showStatus("Login successful", "success");

    setTimeout(function(){
      showWorkspace(session);
    }, 350);

  }catch(err){
    console.error("Login error:", err);
    showStatus(err?.message || "Unable to login. Please try again.", "error");
  }finally{
    stopLoading();
  }
});

/* Only normal Login is connected right now */
otpBtn.addEventListener("click", function(){
  const gmail = email.value.trim();
  if(!gmail){
    setError(emailField, emailError, "Please enter your Gmail");
    email.focus();
    return;
  }
  showStatus("OTP login will be connected next.", "info");
});

forgotBtn.addEventListener("click", function(){

================================ */
function formatCompanyName(value){
  const text = String(value || "Company").trim().toLowerCase();
  return text.replace(/(^|\s|[-&/()])([a-z])/g, (m, before, letter) => before + letter.toUpperCase());
}

async function showWorkspace(session){
  const loginPage = document.querySelector(".page");
  const workspace = document.getElementById("workspaceScreen");
  if(loginPage) loginPage.style.display = "none";
  if(workspace) workspace.classList.add("show");

  const companyName = formatCompanyName(session?.company_name || "Company");
  const nameEl = document.getElementById("workspaceCompanyName");
  const fallback = document.getElementById("workspaceCompanyFallback");
  if(nameEl) nameEl.textContent = companyName;
  if(fallback) fallback.textContent = (companyName[0] || "C").toUpperCase();

  fillProfilePanel(session);
  syncCompanyChatIdentity(session);
  await loadWorkspaceCompanyLogo(session?.company_id);
}

async function loadWorkspaceCompanyLogo(companyId){
  const img = document.getElementById("workspaceCompanyLogo");
  const fallback = document.getElementById("workspaceCompanyFallback");
  if(!img || !fallback || !companyId) return;

  img.style.display = "none";
  fallback.style.display = "grid";

  try{
    const {data,error} = await db.rpc("list_companies_with_logo");
    if(error) throw error;

    const company = (data || []).find(x => String(x.id) === String(companyId));
    const logo = company?.logo_url;
    if(!logo) return;

    img.onload = function(){
      img.style.display = "block";
      fallback.style.display = "none";

      const chatLogo = document.getElementById("companyChatLogo");
      const chatFallback = document.getElementById("companyChatFallback");
      const chatHeaderLogo = document.getElementById("chatHeaderLogo");
      const chatHeaderFallback = document.getElementById("chatHeaderFallback");

      if(chatLogo){
        chatLogo.onload = function(){
          chatLogo.style.display = "block";
          if(chatFallback) chatFallback.style.display = "none";
        };
        chatLogo.onerror = function(){
          chatLogo.style.display = "none";
          if(chatFallback) chatFallback.style.display = "grid";
        };
        chatLogo.src = logo;
      }

      if(chatHeaderLogo){
        chatHeaderLogo.onload = function(){
          chatHeaderLogo.style.display = "block";
          if(chatHeaderFallback) chatHeaderFallback.style.display = "none";
        };
        chatHeaderLogo.onerror = function(){
          chatHeaderLogo.style.display = "none";
          if(chatHeaderFallback) chatHeaderFallback.style.display = "grid";
        };
        chatHeaderLogo.src = logo;
      }
    };
    img.onerror = function(){
      img.style.display = "none";
      fallback.style.display = "grid";
    };
    img.src = logo;
  }catch(err){
    console.warn("Company logo load failed:", err);
  }
}


/* ================================
   CHAT + PULL TO REFRESH
================================ */
const workspaceMain = document.getElementById("workspaceMain");
const pullRefresh = document.getElementById("pullRefresh");
const companyChatItem = document.getElementById("companyChatItem");
const companyChatScreen = document.getElementById("companyChatScreen");
const chatBackBtn = document.getElementById("chatBackBtn");
const chatMessages = document.getElementById("chatMessages");
const chatMessageInput = document.getElementById("chatMessageInput");
const chatSendBtn = document.getElementById("chatSendBtn");
const workspaceSearch = document.getElementById("workspaceSearch");

let pullStartY = 0;
let pulling = false;
let refreshing = false;
const workspaceChatList = document.getElementById("workspaceChatList");

let edgeSwipeActive = false;
let edgeSwipeSide = "";
let edgeSwipeStartX = 0;
let edgeSwipeStartY = 0;
let edgeSwipeDistance = 0;

function getTimeLabel(date = new Date()){
  return date.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}

function getCompanyChatKey(){
  const id = window.notusSession?.company_id || "default";
  return "notus_company_fake_chat_" + id;
}

function defaultCompanyMessages(){
  const company = formatCompanyName(window.notusSession?.company_name || "Company");
  return [
    {
      side:"in",
      text:`Welcome to ${company}. This is your official company chat.`,
      time:getTimeLabel()
    }
  ];
}

function readCompanyMessages(){
  try{
    const saved = JSON.parse(localStorage.getItem(getCompanyChatKey()) || "null");
    if(Array.isArray(saved) && saved.length) return saved;
  }catch(e){}
  return defaultCompanyMessages();
}

function saveCompanyMessages(messages){
  try{ localStorage.setItem(getCompanyChatKey(), JSON.stringify(messages)); }catch(e){}
}

function renderCompanyMessages(){
  if(!chatMessages) return;
  const messages = readCompanyMessages();
  chatMessages.innerHTML = '<div class="chat-day"><span>Today</span></div>';
  messages.forEach(msg=>{
    const row = document.createElement("div");
    row.className = "message-row " + (msg.side === "out" ? "out" : "in");
    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    const text = document.createElement("div");
    text.textContent = msg.text;
    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = msg.time || "";
    bubble.appendChild(text);
    bubble.appendChild(time);
    row.appendChild(bubble);
    chatMessages.appendChild(row);
  });
  requestAnimationFrame(()=>{ chatMessages.scrollTop = chatMessages.scrollHeight; });

  const last = messages[messages.length - 1];
  const preview = document.getElementById("companyChatPreview");
  const time = document.getElementById("companyChatTime");
  if(preview && last) preview.textContent = last.text;
  if(time && last) time.textContent = last.time || "";
}

function syncCompanyChatIdentity(session){
  const company = formatCompanyName(session?.company_name || "Company");
  const first = (company[0] || "C").toUpperCase();
  const listName = document.getElementById("companyChatName");
  const fallback = document.getElementById("companyChatFallback");
  const headerName = document.getElementById("chatHeaderName");
  const headerFallback = document.getElementById("chatHeaderFallback");
  if(listName) listName.textContent = company;
  if(fallback) fallback.textContent = first;
  if(headerName) headerName.textContent = company;
  if(headerFallback) headerFallback.textContent = first;
  renderCompanyMessages();
}

let chatBodyPreviousOverflow = "";

function updateChatViewportHeight(){
  if(!companyChatScreen) return;
  const vv = window.visualViewport;
  const height = vv ? vv.height : window.innerHeight;
  companyChatScreen.style.setProperty("--chat-viewport-height", Math.round(height) + "px");

  if(companyChatScreen.classList.contains("show")){
    requestAnimationFrame(()=>{
      if(chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
    });
  }
}

window.visualViewport?.addEventListener("resize", updateChatViewportHeight);
window.visualViewport?.addEventListener("scroll", updateChatViewportHeight);
window.addEventListener("resize", updateChatViewportHeight);
updateChatViewportHeight();

function openCompanyChat(){
  renderCompanyMessages();
  updateChatViewportHeight();

  chatBodyPreviousOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";

  companyChatScreen?.classList.add("show");
  companyChatScreen?.setAttribute("aria-hidden","false");

  requestAnimationFrame(()=>{
    if(chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

function closeCompanyChat(){
  companyChatScreen?.classList.remove("show");
  companyChatScreen?.setAttribute("aria-hidden","true");
  chatMessageInput?.blur();
  document.body.style.overflow = chatBodyPreviousOverflow || "";
}
companyChatItem?.addEventListener("click", openCompanyChat);
chatBackBtn?.addEventListener("click", closeCompanyChat);

function sendCompanyMessage(){
  const text = String(chatMessageInput?.value || "").trim();
  if(!text) return;
  const messages = readCompanyMessages();
  messages.push({side:"out", text, time:getTimeLabel()});
  saveCompanyMessages(messages);
  chatMessageInput.value = "";
  chatMessageInput.style.height = "auto";
  renderCompanyMessages();
}
chatSendBtn?.addEventListener("click", sendCompanyMessage);
chatMessageInput?.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendCompanyMessage();
  }
});
chatMessageInput?.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight,88) + "px";
  requestAnimationFrame(()=>{
    if(chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
  });
});

chatMessageInput?.addEventListener("focus", function(){
  updateChatViewportHeight();
  setTimeout(()=>{
    updateChatViewportHeight();
    if(chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
  },80);
  setTimeout(()=>{
    updateChatViewportHeight();
    if(chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
  },300);
});

workspaceSearch?.addEventListener("input", function(){
  const q = this.value.trim().toLowerCase();
  const company = document.getElementById("companyChatName")?.textContent?.toLowerCase() || "";
  const preview = document.getElementById("companyChatPreview")?.textContent?.toLowerCase() || "";
  if(companyChatItem) companyChatItem.style.display = (!q || company.includes(q) || preview.includes(q)) ? "flex" : "none";
});

/* Smooth iPhone-style pull to refresh */
function resetPullRefresh(){
  if(workspaceChatList){
    workspaceChatList.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
    workspaceChatList.style.transform = "translate3d(0,0,0)";
  }
  if(pullRefresh){
    pullRefresh.classList.remove("show","loading");
    pullRefresh.style.transform = "translate3d(-50%,-30px,0) scale(.82)";
    pullRefresh.style.opacity = "0";
  }
}

workspaceMain?.addEventListener("touchstart", function(e){
  if(refreshing || companyChatScreen?.classList.contains("show")) return;
  if(workspaceMain.scrollTop <= 0 && e.touches?.length === 1){
    pullStartY = e.touches[0].clientY;
    pulling = true;
    if(workspaceChatList) workspaceChatList.style.transition = "none";
    if(pullRefresh) pullRefresh.style.transition = "none";
  }
},{passive:true});

workspaceMain?.addEventListener("touchmove", function(e){
  if(!pulling || refreshing || !e.touches?.length) return;

  const rawDistance = e.touches[0].clientY - pullStartY;
  if(rawDistance <= 0){
    resetPullRefresh();
    return;
  }

  e.preventDefault();

  const pull = Math.min(66, rawDistance * .48);

  if(workspaceChatList){
    workspaceChatList.style.transform = `translate3d(0,${pull}px,0)`;
  }

  if(pullRefresh){
    const spinnerY = Math.min(18, -18 + pull * .55);
    const scale = Math.min(1, .78 + pull / 180);
    pullRefresh.classList.add("show");
    pullRefresh.style.opacity = String(Math.min(1, pull / 34));
    pullRefresh.style.transform = `translate3d(-50%,${spinnerY}px,0) scale(${scale})`;

    const spinner = pullRefresh.querySelector(".pull-spinner");
    if(spinner) spinner.style.transform = `rotate(${Math.min(280,rawDistance * 2.2)}deg)`;
  }
},{passive:false});

workspaceMain?.addEventListener("touchend", function(){
  if(!pulling) return;
  pulling = false;

  const transform = workspaceChatList?.style.transform || "";
  const match = transform.match(/translate3d\(0,\s*([0-9.]+)px/i);
  const pull = match ? parseFloat(match[1]) : 0;

  if(pull >= 44){
    refreshing = true;

    if(workspaceChatList){
      workspaceChatList.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
      workspaceChatList.style.transform = "translate3d(0,54px,0)";
    }

    if(pullRefresh){
      pullRefresh.style.transition = "opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1)";
      pullRefresh.classList.add("show","loading");
      pullRefresh.style.opacity = "1";
      pullRefresh.style.transform = "translate3d(-50%,10px,0) scale(1)";
      const spinner = pullRefresh.querySelector(".pull-spinner");
      if(spinner) spinner.style.transform = "";
    }

    setTimeout(()=>{
      renderCompanyMessages();
      refreshing = false;
      resetPullRefresh();
    },700);
  }else{
    resetPullRefresh();
  }
});

workspaceMain?.addEventListener("touchcancel", function(){
  pulling = false;
  if(!refreshing) resetPullRefresh();
});

/* Back swipe from BOTH screen edges */
companyChatScreen?.addEventListener("touchstart", function(e){
  if(!companyChatScreen.classList.contains("show") || e.touches?.length !== 1) return;

  const touch = e.touches[0];
  const edge = 26;

  if(touch.clientX <= edge){
    edgeSwipeActive = true;
    edgeSwipeSide = "left";
  }else if(touch.clientX >= window.innerWidth - edge){
    edgeSwipeActive = true;
    edgeSwipeSide = "right";
  }else{
    edgeSwipeActive = false;
    return;
  }

  edgeSwipeStartX = touch.clientX;
  edgeSwipeStartY = touch.clientY;
  edgeSwipeDistance = 0;
  companyChatScreen.style.transition = "none";
},{passive:true});

companyChatScreen?.addEventListener("touchmove", function(e){
  if(!edgeSwipeActive || e.touches?.length !== 1) return;

  const touch = e.touches[0];
  const dx = touch.clientX - edgeSwipeStartX;
  const dy = touch.clientY - edgeSwipeStartY;

  if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){
    edgeSwipeActive = false;
    companyChatScreen.style.transition = "";
    companyChatScreen.style.transform = "";
    return;
  }

  let distance = 0;
  if(edgeSwipeSide === "left") distance = Math.max(0, dx);
  else distance = Math.max(0, -dx);

  if(distance <= 0) return;

  e.preventDefault();
  edgeSwipeDistance = Math.min(window.innerWidth, distance);

  const signed = edgeSwipeSide === "left" ? edgeSwipeDistance : -edgeSwipeDistance;
  companyChatScreen.style.transform = `translate3d(${signed}px,0,0)`;
},{passive:false});

function finishEdgeSwipe(){
  if(!edgeSwipeActive) return;

  const shouldClose = edgeSwipeDistance > 72;
  const side = edgeSwipeSide;

  edgeSwipeActive = false;
  edgeSwipeDistance = 0;

  companyChatScreen.style.transition = "transform .24s cubic-bezier(.2,.8,.2,1)";

  if(shouldClose){
    const target = side === "left" ? "100%" : "-100%";
    companyChatScreen.style.transform = `translate3d(${target},0,0)`;

    setTimeout(()=>{
      companyChatScreen.classList.remove("show");
      companyChatScreen.setAttribute("aria-hidden","true");
      companyChatScreen.style.transition = "";
      companyChatScreen.style.transform = "";
      chatMessageInput?.blur();
      document.body.style.overflow = chatBodyPreviousOverflow || "";
    },240);
  }else{
    companyChatScreen.style.transform = "translate3d(0,0,0)";
    setTimeout(()=>{
      companyChatScreen.style.transition = "";
      companyChatScreen.style.transform = "";
    },240);
  }
}

companyChatScreen?.addEventListener("touchend", finishEdgeSwipe, {passive:true});
companyChatScreen?.addEventListener("touchcancel", finishEdgeSwipe, {passive:true});
